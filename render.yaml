# Hospedagem do SERVIDOR multiplayer no Render (o GitHub Pages hospeda so o cliente).
# NAO verificado: este arquivo nao foi testado no Render. Se o build falhar, cole o log no chat.
services:
  - type: web
    name: worldzero-server
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @worldzero/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGIN
        value: "*"
      # Mundos (Etapa 13): id:Nome:regiao separados por ; . Cada mundo e uma sala com ate 50 jogadores (ver HOSPEDAR_SERVIDOR.md).
      - key: WORLDS
        value: "mundo-1:Mundo 1:br"
      # Persistencia (ver HOSPEDAR_SERVIDOR.md). Preencha no painel do Render; NUNCA coloque a senha/chave aqui.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

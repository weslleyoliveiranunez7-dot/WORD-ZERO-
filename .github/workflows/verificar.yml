name: Verificar
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Etapa 12: um PostgreSQL de verdade so para os testes de persistencia (sai junto com o job).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wz
          POSTGRES_PASSWORD: wz
          POSTGRES_DB: wz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar projeto (se houver WORLD-ZERO-*.zip na raiz)
        if: hashFiles('WORLD-ZERO-*.zip') != ''
        run: |
          for z in WORLD-ZERO-*.zip; do
            rm -rf /tmp/wz && mkdir /tmp/wz
            unzip -o "$z" -d /tmp/wz
            rm -rf /tmp/wz/WORLD-ZERO/.github
            cp -r /tmp/wz/WORLD-ZERO/. .
            rm "$z"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Atualiza projeto a partir do zip"
          git push

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        id: install
        run: pnpm install --no-frozen-lockfile

      - name: Verificar tipos
        id: tipos
        run: pnpm typecheck

      - name: Testes
        id: testes
        run: pnpm test

      - name: Build do cliente web
        id: build
        run: pnpm build:web

      - name: Teste do servidor (liga e consulta /health)
        id: servidor
        run: |
          pnpm --filter @worldzero/server start > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:2567/health && break; sleep 1; done
          curl -sf http://localhost:2567/health

      - name: Teste multiplayer (2 clientes separados, processos diferentes)
        id: multiplayer
        run: |
          curl -sf http://localhost:2567/health
          cd apps/server
          export SERVER_WS=ws://localhost:2567
          RA=0; RB=0
          pnpm exec tsx src/bot.ts --name A --linger 12000 > ../../botA.log 2>&1 &
          PA=$!
          pnpm exec tsx src/bot.ts --name B --reconnect --linger 3000 > ../../botB.log 2>&1 || RB=$?
          wait $PA || RA=$?
          cd ../..
          cat botA.log botB.log
          [ "$RA" -eq 0 ] && [ "$RB" -eq 0 ]

      - name: Teste de seguranca (cliente malicioso tenta trapacear)
        id: seguranca
        run: |
          set -o pipefail
          curl -sf http://localhost:2567/health
          cd apps/server
          SERVER_WS=ws://localhost:2567 pnpm exec tsx src/attacker.ts 2>&1 | tee ../../atacante.log

      - name: Teste de sobrevivencia (servidor com tempo acelerado x100)
        id: sobrevivencia
        run: |
          set -o pipefail
          PORT=2568 SURVIVAL_SCALE=100 pnpm --filter @worldzero/server start > server-surv.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:2568/health && break; sleep 1; done
          curl -sf http://localhost:2568/health
          cd apps/server
          SERVER_WS=ws://localhost:2568 pnpm exec tsx src/survivor.ts 2>&1 | tee ../../sobrevivencia.log

      - name: Teste de combate PvP (2 clientes, servidor novo, relogio real ~40 s)
        id: pvp
        run: |
          set -o pipefail
          PORT=2569 pnpm --filter @worldzero/server start > server-pvp.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:2569/health && break; sleep 1; done
          curl -sf http://localhost:2569/health
          cd apps/server
          SERVER_WS=ws://localhost:2569 pnpm exec tsx src/duel.ts 2>&1 | tee ../../pvp.log

      - name: Teste de persistencia (arquivos + PostgreSQL real, migracoes, snapshots, backup)
        id: persistencia
        run: |
          set -o pipefail
          cd apps/server
          DATABASE_URL=postgres://wz:wz@localhost:5432/wz pnpm exec tsx src/persistcheck.ts 2>&1 | tee ../../persistencia.log

      - name: "Teste de reinicio (servidor real - queda brusca, desligar/ligar, registro quebrado) - arquivos"
        id: reinicio_arquivos
        run: |
          set -o pipefail
          cd apps/server
          RESTART_PORT=2570 pnpm exec tsx src/restart.ts 2>&1 | tee ../../reinicio-arquivos.log

      - name: Teste de reinicio (servidor real) - PostgreSQL
        id: reinicio_postgres
        run: |
          set -o pipefail
          cd apps/server
          DATABASE_URL=postgres://wz:wz@localhost:5432/wz DATABASE_SSL=disable RESTART_PORT=2571 pnpm exec tsx src/restart.ts 2>&1 | tee ../../reinicio-postgres.log

      - name: "Teste de servidores (2 mundos, lista, lotado, mundos independentes, reconexao)"
        id: servidores
        timeout-minutes: 3
        run: |
          set -o pipefail
          cd apps/server
          WORLDS_PORT=2572 pnpm exec tsx src/worldcheck.ts 2>&1 | tee ../../servidores.log

      - name: "Teste de temporada (relogio acelerado, wipe, recuperacao de falha) - arquivos e PostgreSQL real"
        id: temporada
        timeout-minutes: 3
        run: |
          set -o pipefail
          cd apps/server
          pnpm exec tsx src/seasoncheck.ts 2>&1 | tee ../../temporada.log
          DATABASE_URL=postgres://wz:wz@localhost:5432/wz DATABASE_SSL=disable pnpm exec tsx src/seasoncheck.ts 2>&1 | tee -a ../../temporada.log

      - name: Salvar pnpm-lock.yaml no repositorio
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || (git commit -m "Atualiza pnpm-lock.yaml" && git push)

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Resultado da verificacao"
            echo "- Instalar dependencias: ${{ steps.install.outcome }}"
            echo "- Verificar tipos: ${{ steps.tipos.outcome }}"
            echo "- Testes: ${{ steps.testes.outcome }}"
            echo "- Build do cliente web: ${{ steps.build.outcome }}"
            echo "- Servidor liga e responde /health: ${{ steps.servidor.outcome }}"
            echo "- Multiplayer (2 clientes + reconexao): ${{ steps.multiplayer.outcome }}"
            echo "- Seguranca (cliente malicioso): ${{ steps.seguranca.outcome }}"
            echo "- Sobrevivencia (fome, sede, itens, morte, reaparecer): ${{ steps.sobrevivencia.outcome }}"
            echo "- Combate PvP (dano, recarga, alcance, morte, protecao): ${{ steps.pvp.outcome }}"
            echo "- Persistencia (arquivos + PostgreSQL, migracoes, snapshots, backup): ${{ steps.persistencia.outcome }}"
            echo "- Reinicio do servidor (arquivos): ${{ steps.reinicio_arquivos.outcome }}"
            echo "- Reinicio do servidor (PostgreSQL): ${{ steps.reinicio_postgres.outcome }}"
            echo "- Servidores (lista, mundos, limite de jogadores, lotado, reconexao): ${{ steps.servidores.outcome }}"
            echo ""
            echo "### Logs dos bots"
            echo '```'
            cat botA.log botB.log 2>/dev/null || echo "(sem log)"
            echo '```'
            echo ""
            echo "### Ataques de teste (esperado: todos OK)"
            echo '```'
            cat atacante.log 2>/dev/null || echo "(sem log)"
            echo '```'
            echo ""
            echo "### Teste de sobrevivencia (esperado: todos OK)"
            echo '```'
            cat sobrevivencia.log 2>/dev/null || echo "(sem log)"
            echo '```'
            echo ""
            echo "### Teste de combate PvP (esperado: todos OK)"
            echo '```'
            cat pvp.log 2>/dev/null || echo "(sem log)"
            echo '```'
            echo ""
            echo "### Teste de persistencia (esperado: TODOS OK)"
            echo '```'
            cat persistencia.log 2>/dev/null || echo "(sem log)"
            echo '```'
            echo ""
            echo "### Teste de reinicio - arquivos (esperado: TODOS OK)"
            echo '```'
            cat reinicio-arquivos.log 2>/dev/null || echo "(sem log)"
            echo '```'
            echo ""
            echo "### Teste de reinicio - PostgreSQL (esperado: TODOS OK)"
            echo '```'
            cat reinicio-postgres.log 2>/dev/null || echo "(sem log)"
            echo '```'
            echo ""
            echo "### Teste de servidores (esperado: TODOS OK)"
            echo '```'
            cat servidores.log 2>/dev/null || echo "(sem log)"
            echo '```'
            echo ""
            echo "### Teste de temporada (esperado: TODOS OS TESTES DE TEMPORADA PASSARAM, 2x)"
            echo '```'
            cat temporada.log 2>/dev/null || echo "(sem log)"
            echo '```'
            echo ""
            echo "### Log do servidor"
            echo '```'
            tail -n 30 server.log 2>/dev/null || echo "(sem log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Publica o cliente web no GitHub Pages para voce jogar pelo celular.
  # Exige: Settings > Pages > Source = "GitHub Actions".
  publicar:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

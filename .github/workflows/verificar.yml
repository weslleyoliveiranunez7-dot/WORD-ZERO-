name: Verificar
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar projeto (se houver WORLD-ZERO-*.zip na raiz)
        if: hashFiles('WORLD-ZERO-*.zip') != ''
        run: |
          for z in WORLD-ZERO-*.zip; do
            rm -rf /tmp/wz && mkdir /tmp/wz
            unzip -o "$z" -d /tmp/wz
            rm -rf /tmp/wz/WORLD-ZERO/.github
            cp -r /tmp/wz/WORLD-ZERO/. .
            rm "$z"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Atualiza projeto a partir do zip"
          git push

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        id: install
        run: pnpm install --no-frozen-lockfile

      - name: Verificar tipos
        id: tipos
        run: pnpm typecheck

      - name: Testes
        id: testes
        run: pnpm test

      - name: Build do cliente web
        id: build
        run: pnpm build:web

      - name: Teste do servidor (liga e consulta /health)
        id: servidor
        run: |
          pnpm --filter @worldzero/server start > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:2567/health && break; sleep 1; done
          curl -sf http://localhost:2567/health

      - name: Salvar pnpm-lock.yaml no repositorio
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || (git commit -m "Atualiza pnpm-lock.yaml" && git push)

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Resultado da verificacao"
            echo "- Instalar dependencias: ${{ steps.install.outcome }}"
            echo "- Verificar tipos: ${{ steps.tipos.outcome }}"
            echo "- Testes: ${{ steps.testes.outcome }}"
            echo "- Build do cliente web: ${{ steps.build.outcome }}"
            echo "- Servidor liga e responde /health: ${{ steps.servidor.outcome }}"
            echo ""
            echo "### Log do servidor"
            echo '```'
            tail -n 30 server.log 2>/dev/null || echo "(sem log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Publica o cliente web no GitHub Pages para voce jogar pelo celular.
  # Exige: Settings > Pages > Source = "GitHub Actions".
  publicar:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

name: Pages (cliente web)
# Publica SO o cliente web (arquivos estaticos) no GitHub Pages. O servidor multiplayer NAO roda aqui: ele fica no Render.
# Roda so quando voce mandar: Actions > "Pages (cliente web)" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: "Build do cliente web (base relativa, funciona em subpasta do Pages)"
        run: pnpm --filter @worldzero/web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
